<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>修改会员</title>
    <link href="/css/style.css" rel="stylesheet" type="text/css" />
    <script type="text/javascript" src="/js/jquery.js"></script>
    <script type="text/javascript">
        $(document).ready(function(){
            $(".click").click(function(){
                $(".tip").fadeIn(200);
            });

            $(".tiptop a").click(function(){
                $(".tip").fadeOut(200);
            });

            $(".sure").click(function(){
                $(".tip").fadeOut(100);
            });

            $(".cancel").click(function(){
                $(".tip").fadeOut(100);
            });
        });
    </script>
</head>
<body>
<div class="place">
    <span>位置：</span>
    <ul class="placeul">
        <li><a href="#">会员管理</a></li>
        <li><a href="#">修改会员</a></li>
    </ul>
</div>

<div class="formbody">
    <div class="formtitle"><span>修改会员信息</span></div>
    <form action="/member/updatemember" method="post">
        <input type="hidden" name="memberId" th:value="${member.memberId}">
        <ul class="forminfo">
            <li><label>姓名</label><input name="name" type="text" class="dfinput" th:value="${member.name}" required/></li>
            <li><label>年龄</label><input name="age" type="number" class="dfinput" th:value="${member.age}" required/></li>
            <li>
                <label>性别</label>
                <cite>
                    <input name="gender" type="radio" value="男" th:checked="${member.gender eq 'M'}" />男&nbsp;&nbsp;&nbsp;&nbsp;
                    <input name="gender" type="radio" value="女" th:checked="${member.gender eq 'F'}" />女
                </cite>
            </li>
            <li><label>手机号</label><input name="phone" type="text" class="dfinput" th:value="${member.phone}" required/></li>
            <li>
                <label>注册时间</label>
                <input name="registerDate" type="text" class="dfinput"
                       onclick="WdatePicker({el:this,dateFmt:'yyyy-MM-dd'})"
                       th:value="${#temporals.format(member.registerDate, 'yyyy-MM-dd')}" required/>
            </li>
            <li><label>账户余额</label><input name="balance" type="number" step="0.01" class="dfinput" th:value="${member.balance}" required/></li>
            <li><label>&nbsp;</label><input type="submit" class="btn" value="保存修改"/></li>
        </ul>
    </form>
</div>
</body>
</html>
