<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>个人信息</title>
    <link href="css/style.css" rel="stylesheet" type="text/css" />
</head>
<body>
<div class="place">
    <span>位置：</span>
    <ul class="placeul">
        <li><a href="#">个人中心</a></li>
        <li><a href="#">个人信息</a></li>
    </ul>
</div>

<div class="formbody">
    <div class="formtitle"><span>个人基本信息</span></div>

    <div class="formview">
        <ul class="forminfo">
            <li><label>会员ID</label><span class="viewinput">1001</span></li>
            <li><label>姓名</label><span class="viewinput">张三</span></li>
            <li><label>年龄</label><span class="viewinput">28</span></li>
            <li><label>性别</label><span class="viewinput">男</span></li>
            <li><label>手机号</label><span class="viewinput">13800138000</span></li>
            <li><label>注册日期</label><span class="viewinput">1995-05-15</span></li>
            <li><label>账户余额</label><span class="viewinput">¥2,500.00</span></li>
        </ul>
    </div>
    <div class="formtitle"><span>当前健身计划</span></div>

    <div class="button-area">
        <button type="button" class="btn" onclick="location.href='#'">充值会员卡</button>
        <button type="button" class="btn" onclick="location.href='#'">修改信息</button>
        <button type="button" class="btn" onclick="history.back()">返回</button>
    </div>
</div>
</body>
</html>
